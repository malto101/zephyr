# ESP32-S3 pad table for board-pinout.
# IO_MUX functions: hal_espressif components/soc/esp32s3/register/soc/io_mux_reg.h
# GPIO matrix signals: include/zephyr/dt-bindings/pinctrl/esp32s3-pinctrl.h
schema_version: "1.0"
soc: esp32s3
description: ESP32-S3 (Xtensa LX7 dual core, Wi-Fi, Bluetooth LE)
reference: {title: ESP32-S3 Technical Reference Manual, section: "6 IO MUX and GPIO Matrix", url: "https://www.espressif.com/sites/default/files/documentation/esp32-s3_technical_reference_manual_en.pdf"}
domains:
  VDD3P3_RTC: {io_voltages: [3.3], notes: RTC IO domain (GPIO0-GPIO21)}
  VDD3P3_CPU: {io_voltages: [3.3], notes: Digital IO domain (GPIO38-GPIO48)}
  VDD_SPI: {io_voltages: [1.8, 3.3], configurable: true, notes: "Flash/PSRAM domain (GPIO26-GPIO37), selected by GPIO45 strap or eFuse"}
pad_defaults:
  type: io
  domain: VDD3P3_RTC
  drive_options: [{value: 5, unit: mA}, {value: 10, unit: mA}, {value: 20, unit: mA}, {value: 40, unit: mA}]
  pull: {pu_ohm: 45000, pd_ohm: 45000}
  reset: {mode: input, bias: none}
pads:
  GPIO0:
    reset: {mode: input, bias: pull_up}
    strap: {function: BOOT_MODE, sampled_at: reset, level: high, notes: Low (with GPIO46 low) enters download mode}
    functions:
      - {function: GPIO0, class: gpio, mode: 1}
      - {function: RTC_GPIO0, class: wakeup, mode: RTC}
  GPIO1:
    functions:
      - {function: GPIO1, class: gpio, mode: 1}
      - {function: ADC1_CH0, peripheral: ADC1, signal: CH0, class: analog, mode: ANALOG, analog: {channel: 0, polarity: single}}
      - {function: TOUCH1, peripheral: TOUCH, signal: CH1, class: analog, mode: RTC}
      - {function: RTC_GPIO1, class: wakeup, mode: RTC}
  GPIO2:
    functions:
      - {function: GPIO2, class: gpio, mode: 1}
      - {function: ADC1_CH1, peripheral: ADC1, signal: CH1, class: analog, mode: ANALOG, analog: {channel: 1, polarity: single}}
      - {function: TOUCH2, peripheral: TOUCH, signal: CH2, class: analog, mode: RTC}
      - {function: RTC_GPIO2, class: wakeup, mode: RTC}
  GPIO3:
    strap: {function: JTAG_SEL, sampled_at: reset, level: any, notes: Selects JTAG source when eFuse STRAP_JTAG_SEL is set}
    functions:
      - {function: GPIO3, class: gpio, mode: 1}
      - {function: ADC1_CH2, peripheral: ADC1, signal: CH2, class: analog, mode: ANALOG, analog: {channel: 2, polarity: single}}
      - {function: TOUCH3, peripheral: TOUCH, signal: CH3, class: analog, mode: RTC}
      - {function: RTC_GPIO3, class: wakeup, mode: RTC}
  GPIO4:
    functions:
      - {function: GPIO4, class: gpio, mode: 1}
      - {function: ADC1_CH3, peripheral: ADC1, signal: CH3, class: analog, mode: ANALOG, analog: {channel: 3, polarity: single}}
      - {function: TOUCH4, peripheral: TOUCH, signal: CH4, class: analog, mode: RTC}
      - {function: RTC_GPIO4, class: wakeup, mode: RTC}
  GPIO5:
    functions:
      - {function: GPIO5, class: gpio, mode: 1}
      - {function: ADC1_CH4, peripheral: ADC1, signal: CH4, class: analog, mode: ANALOG, analog: {channel: 4, polarity: single}}
      - {function: TOUCH5, peripheral: TOUCH, signal: CH5, class: analog, mode: RTC}
      - {function: RTC_GPIO5, class: wakeup, mode: RTC}
  GPIO6:
    functions:
      - {function: GPIO6, class: gpio, mode: 1}
      - {function: ADC1_CH5, peripheral: ADC1, signal: CH5, class: analog, mode: ANALOG, analog: {channel: 5, polarity: single}}
      - {function: TOUCH6, peripheral: TOUCH, signal: CH6, class: analog, mode: RTC}
      - {function: RTC_GPIO6, class: wakeup, mode: RTC}
  GPIO7:
    functions:
      - {function: GPIO7, class: gpio, mode: 1}
      - {function: ADC1_CH6, peripheral: ADC1, signal: CH6, class: analog, mode: ANALOG, analog: {channel: 6, polarity: single}}
      - {function: TOUCH7, peripheral: TOUCH, signal: CH7, class: analog, mode: RTC}
      - {function: RTC_GPIO7, class: wakeup, mode: RTC}
  GPIO8:
    functions:
      - {function: SUBSPICS1, peripheral: SUBSPI, signal: CS1, class: digital, direction: out, mode: 3}
      - {function: GPIO8, class: gpio, mode: 1}
      - {function: ADC1_CH7, peripheral: ADC1, signal: CH7, class: analog, mode: ANALOG, analog: {channel: 7, polarity: single}}
      - {function: TOUCH8, peripheral: TOUCH, signal: CH8, class: analog, mode: RTC}
      - {function: RTC_GPIO8, class: wakeup, mode: RTC}
  GPIO9:
    functions:
      - {function: SUBSPIHD, peripheral: SUBSPI, signal: HD, class: digital, direction: inout, mode: 3}
      - {function: FSPIHD, peripheral: SPI2, signal: HD, class: digital, direction: inout, mode: 4}
      - {function: GPIO9, class: gpio, mode: 1}
      - {function: ADC1_CH8, peripheral: ADC1, signal: CH8, class: analog, mode: ANALOG, analog: {channel: 8, polarity: single}}
      - {function: TOUCH9, peripheral: TOUCH, signal: CH9, class: analog, mode: RTC}
      - {function: RTC_GPIO9, class: wakeup, mode: RTC}
  GPIO10:
    functions:
      - {function: FSPIIO4, peripheral: SPI2, signal: IO4, class: digital, direction: inout, mode: 2}
      - {function: SUBSPICS0, peripheral: SUBSPI, signal: CS0, class: digital, direction: out, mode: 3}
      - {function: FSPICS0, peripheral: SPI2, signal: CS0, class: digital, direction: out, mode: 4}
      - {function: GPIO10, class: gpio, mode: 1}
      - {function: ADC1_CH9, peripheral: ADC1, signal: CH9, class: analog, mode: ANALOG, analog: {channel: 9, polarity: single}}
      - {function: TOUCH10, peripheral: TOUCH, signal: CH10, class: analog, mode: RTC}
      - {function: RTC_GPIO10, class: wakeup, mode: RTC}
  GPIO11:
    functions:
      - {function: FSPIIO5, peripheral: SPI2, signal: IO5, class: digital, direction: inout, mode: 2}
      - {function: SUBSPID, peripheral: SUBSPI, signal: D, class: digital, direction: inout, mode: 3}
      - {function: FSPID, peripheral: SPI2, signal: D, class: digital, direction: inout, mode: 4}
      - {function: GPIO11, class: gpio, mode: 1}
      - {function: ADC2_CH0, peripheral: ADC2, signal: CH0, class: analog, mode: ANALOG, analog: {channel: 0, polarity: single}}
      - {function: TOUCH11, peripheral: TOUCH, signal: CH11, class: analog, mode: RTC}
      - {function: RTC_GPIO11, class: wakeup, mode: RTC}
  GPIO12:
    functions:
      - {function: FSPIIO6, peripheral: SPI2, signal: IO6, class: digital, direction: inout, mode: 2}
      - {function: SUBSPICLK, peripheral: SUBSPI, signal: CLK, class: digital, direction: out, mode: 3}
      - {function: FSPICLK, peripheral: SPI2, signal: CLK, class: digital, direction: out, mode: 4}
      - {function: GPIO12, class: gpio, mode: 1}
      - {function: ADC2_CH1, peripheral: ADC2, signal: CH1, class: analog, mode: ANALOG, analog: {channel: 1, polarity: single}}
      - {function: TOUCH12, peripheral: TOUCH, signal: CH12, class: analog, mode: RTC}
      - {function: RTC_GPIO12, class: wakeup, mode: RTC}
  GPIO13:
    functions:
      - {function: FSPIIO7, peripheral: SPI2, signal: IO7, class: digital, direction: inout, mode: 2}
      - {function: SUBSPIQ, peripheral: SUBSPI, signal: Q, class: digital, direction: inout, mode: 3}
      - {function: FSPIQ, peripheral: SPI2, signal: Q, class: digital, direction: inout, mode: 4}
      - {function: GPIO13, class: gpio, mode: 1}
      - {function: ADC2_CH2, peripheral: ADC2, signal: CH2, class: analog, mode: ANALOG, analog: {channel: 2, polarity: single}}
      - {function: TOUCH13, peripheral: TOUCH, signal: CH13, class: analog, mode: RTC}
      - {function: RTC_GPIO13, class: wakeup, mode: RTC}
  GPIO14:
    functions:
      - {function: FSPIDQS, peripheral: SPI2, signal: DQS, class: digital, direction: inout, mode: 2}
      - {function: SUBSPIWP, peripheral: SUBSPI, signal: WP, class: digital, direction: inout, mode: 3}
      - {function: FSPIWP, peripheral: SPI2, signal: WP, class: digital, direction: inout, mode: 4}
      - {function: GPIO14, class: gpio, mode: 1}
      - {function: ADC2_CH3, peripheral: ADC2, signal: CH3, class: analog, mode: ANALOG, analog: {channel: 3, polarity: single}}
      - {function: TOUCH14, peripheral: TOUCH, signal: CH14, class: analog, mode: RTC}
      - {function: RTC_GPIO14, class: wakeup, mode: RTC}
  GPIO15:
    functions:
      - {function: U0RTS, peripheral: UART0, signal: RTS, class: digital, direction: out, mode: 2}
      - {function: GPIO15, class: gpio, mode: 1}
      - {function: ADC2_CH4, peripheral: ADC2, signal: CH4, class: analog, mode: ANALOG, analog: {channel: 4, polarity: single}}
      - {function: XTAL_32K_P, peripheral: XTAL_32K, signal: P, class: clock, mode: RTC}
      - {function: RTC_GPIO15, class: wakeup, mode: RTC}
  GPIO16:
    functions:
      - {function: U0CTS, peripheral: UART0, signal: CTS, class: digital, direction: in, mode: 2}
      - {function: GPIO16, class: gpio, mode: 1}
      - {function: ADC2_CH5, peripheral: ADC2, signal: CH5, class: analog, mode: ANALOG, analog: {channel: 5, polarity: single}}
      - {function: XTAL_32K_N, peripheral: XTAL_32K, signal: N, class: clock, mode: RTC}
      - {function: RTC_GPIO16, class: wakeup, mode: RTC}
  GPIO17:
    functions:
      - {function: U1TXD, peripheral: UART1, signal: TXD, class: digital, direction: out, mode: 2}
      - {function: GPIO17, class: gpio, mode: 1}
      - {function: ADC2_CH6, peripheral: ADC2, signal: CH6, class: analog, mode: ANALOG, analog: {channel: 6, polarity: single}}
      - {function: RTC_GPIO17, class: wakeup, mode: RTC}
  GPIO18:
    functions:
      - {function: U1RXD, peripheral: UART1, signal: RXD, class: digital, direction: in, mode: 2}
      - {function: CLK_OUT3, peripheral: CLK_OUT, signal: OUT3, class: clock, direction: out, mode: 3}
      - {function: GPIO18, class: gpio, mode: 1}
      - {function: ADC2_CH7, peripheral: ADC2, signal: CH7, class: analog, mode: ANALOG, analog: {channel: 7, polarity: single}}
      - {function: RTC_GPIO18, class: wakeup, mode: RTC}
  GPIO19:
    functions:
      - {function: U1RTS, peripheral: UART1, signal: RTS, class: digital, direction: out, mode: 2}
      - {function: CLK_OUT2, peripheral: CLK_OUT, signal: OUT2, class: clock, direction: out, mode: 3}
      - {function: GPIO19, class: gpio, mode: 1}
      - {function: ADC2_CH8, peripheral: ADC2, signal: CH8, class: analog, mode: ANALOG, analog: {channel: 8, polarity: single}}
      - {function: USB_D_N, peripheral: USB, signal: "D-", class: digital, direction: inout, mode: ANALOG}
      - {function: RTC_GPIO19, class: wakeup, mode: RTC}
  GPIO20:
    functions:
      - {function: U1CTS, peripheral: UART1, signal: CTS, class: digital, direction: in, mode: 2}
      - {function: CLK_OUT1, peripheral: CLK_OUT, signal: OUT1, class: clock, direction: out, mode: 3}
      - {function: GPIO20, class: gpio, mode: 1}
      - {function: ADC2_CH9, peripheral: ADC2, signal: CH9, class: analog, mode: ANALOG, analog: {channel: 9, polarity: single}}
      - {function: USB_D_P, peripheral: USB, signal: "D+", class: digital, direction: inout, mode: ANALOG}
      - {function: RTC_GPIO20, class: wakeup, mode: RTC}
  GPIO21:
    functions:
      - {function: GPIO21, class: gpio, mode: 1}
      - {function: RTC_GPIO21, class: wakeup, mode: RTC}
  GPIO26:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: SPICS1, peripheral: SPI0, signal: CS1, class: digital, direction: out, mode: 0}
      - {function: GPIO26, class: gpio, mode: 1}
  GPIO27:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: SPIHD, peripheral: SPI0, signal: HD, class: digital, direction: inout, mode: 0}
      - {function: GPIO27, class: gpio, mode: 1}
  GPIO28:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: SPIWP, peripheral: SPI0, signal: WP, class: digital, direction: inout, mode: 0}
      - {function: GPIO28, class: gpio, mode: 1}
  GPIO29:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: SPICS0, peripheral: SPI0, signal: CS0, class: digital, direction: out, mode: 0}
      - {function: GPIO29, class: gpio, mode: 1}
  GPIO30:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: SPICLK, peripheral: SPI0, signal: CLK, class: digital, direction: out, mode: 0}
      - {function: GPIO30, class: gpio, mode: 1}
  GPIO31:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: SPIQ, peripheral: SPI0, signal: Q, class: digital, direction: inout, mode: 0}
      - {function: GPIO31, class: gpio, mode: 1}
  GPIO32:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: SPID, peripheral: SPI0, signal: D, class: digital, direction: inout, mode: 0}
      - {function: GPIO32, class: gpio, mode: 1}
  GPIO33:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: FSPIHD, peripheral: SPI2, signal: HD, class: digital, direction: inout, mode: 2}
      - {function: SUBSPIHD, peripheral: SUBSPI, signal: HD, class: digital, direction: inout, mode: 3}
      - {function: SPIIO4, peripheral: SPI0, signal: IO4, class: digital, direction: inout, mode: 4}
      - {function: GPIO33, class: gpio, mode: 1}
  GPIO34:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: FSPICS0, peripheral: SPI2, signal: CS0, class: digital, direction: out, mode: 2}
      - {function: SUBSPICS0, peripheral: SUBSPI, signal: CS0, class: digital, direction: out, mode: 3}
      - {function: SPIIO5, peripheral: SPI0, signal: IO5, class: digital, direction: inout, mode: 4}
      - {function: GPIO34, class: gpio, mode: 1}
  GPIO35:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: FSPID, peripheral: SPI2, signal: D, class: digital, direction: inout, mode: 2}
      - {function: SUBSPID, peripheral: SUBSPI, signal: D, class: digital, direction: inout, mode: 3}
      - {function: SPIIO6, peripheral: SPI0, signal: IO6, class: digital, direction: inout, mode: 4}
      - {function: GPIO35, class: gpio, mode: 1}
  GPIO36:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: FSPICLK, peripheral: SPI2, signal: CLK, class: digital, direction: out, mode: 2}
      - {function: SUBSPICLK, peripheral: SUBSPI, signal: CLK, class: digital, direction: out, mode: 3}
      - {function: SPIIO7, peripheral: SPI0, signal: IO7, class: digital, direction: inout, mode: 4}
      - {function: GPIO36, class: gpio, mode: 1}
  GPIO37:
    domain: VDD_SPI
    notes: Connected to in-package or module flash/PSRAM on most parts
    functions:
      - {function: FSPIQ, peripheral: SPI2, signal: Q, class: digital, direction: inout, mode: 2}
      - {function: SUBSPIQ, peripheral: SUBSPI, signal: Q, class: digital, direction: inout, mode: 3}
      - {function: SPIDQS, peripheral: SPI0, signal: DQS, class: digital, direction: inout, mode: 4}
      - {function: GPIO37, class: gpio, mode: 1}
  GPIO38:
    domain: VDD3P3_CPU
    functions:
      - {function: FSPIWP, peripheral: SPI2, signal: WP, class: digital, direction: inout, mode: 2}
      - {function: SUBSPIWP, peripheral: SUBSPI, signal: WP, class: digital, direction: inout, mode: 3}
      - {function: GPIO38, class: gpio, mode: 1}
  GPIO39:
    domain: VDD3P3_CPU
    functions:
      - {function: MTCK, peripheral: JTAG, signal: TCK, class: debug, direction: in, mode: 0}
      - {function: CLK_OUT3, peripheral: CLK_OUT, signal: OUT3, class: clock, direction: out, mode: 2}
      - {function: SUBSPICS1, peripheral: SUBSPI, signal: CS1, class: digital, direction: out, mode: 3}
      - {function: GPIO39, class: gpio, mode: 1}
  GPIO40:
    domain: VDD3P3_CPU
    functions:
      - {function: MTDO, peripheral: JTAG, signal: TDO, class: debug, direction: out, mode: 0}
      - {function: CLK_OUT2, peripheral: CLK_OUT, signal: OUT2, class: clock, direction: out, mode: 2}
      - {function: GPIO40, class: gpio, mode: 1}
  GPIO41:
    domain: VDD3P3_CPU
    functions:
      - {function: MTDI, peripheral: JTAG, signal: TDI, class: debug, direction: in, mode: 0}
      - {function: CLK_OUT1, peripheral: CLK_OUT, signal: OUT1, class: clock, direction: out, mode: 2}
      - {function: GPIO41, class: gpio, mode: 1}
  GPIO42:
    domain: VDD3P3_CPU
    functions:
      - {function: MTMS, peripheral: JTAG, signal: TMS, class: debug, direction: in, mode: 0}
      - {function: GPIO42, class: gpio, mode: 1}
  GPIO43:
    domain: VDD3P3_CPU
    reset: {mode: function, bias: none, function: U0TXD}
    functions:
      - {function: U0TXD, peripheral: UART0, signal: TXD, class: digital, direction: out, mode: 0}
      - {function: CLK_OUT1, peripheral: CLK_OUT, signal: OUT1, class: clock, direction: out, mode: 2}
      - {function: GPIO43, class: gpio, mode: 1}
  GPIO44:
    domain: VDD3P3_CPU
    reset: {mode: function, bias: pull_up, function: U0RXD}
    functions:
      - {function: U0RXD, peripheral: UART0, signal: RXD, class: digital, direction: in, mode: 0}
      - {function: CLK_OUT2, peripheral: CLK_OUT, signal: OUT2, class: clock, direction: out, mode: 2}
      - {function: GPIO44, class: gpio, mode: 1}
  GPIO45:
    domain: VDD3P3_CPU
    reset: {mode: input, bias: pull_down}
    strap: {function: VDD_SPI_VOLTAGE, sampled_at: reset, level: low, notes: "Low selects 3.3 V, high selects 1.8 V VDD_SPI"}
    functions:
      - {function: GPIO45, class: gpio, mode: 1}
  GPIO46:
    domain: VDD3P3_CPU
    reset: {mode: input, bias: pull_down}
    strap: {function: BOOT_MODE, sampled_at: reset, level: low, notes: Must be low for download mode}
    functions:
      - {function: GPIO46, class: gpio, mode: 1}
  GPIO47:
    domain: VDD3P3_CPU
    functions:
      - {function: SPICLK_P, peripheral: SPI0, signal: CLK_P, class: digital, direction: out, mode: 0}
      - {function: SUBSPICLK_P, peripheral: SUBSPI, signal: CLK_P, class: digital, direction: out, mode: 2}
      - {function: GPIO47, class: gpio, mode: 1}
  GPIO48:
    domain: VDD3P3_CPU
    functions:
      - {function: SPICLK_N, peripheral: SPI0, signal: CLK_N, class: digital, direction: out, mode: 0}
      - {function: SUBSPICLK_N, peripheral: SUBSPI, signal: CLK_N, class: digital, direction: out, mode: 2}
      - {function: GPIO48, class: gpio, mode: 1}
  CHIP_PU:
    aliases: [EN]
    type: special
    domain: VDD3P3_RTC
    notes: Chip enable; high enables the chip, low resets it
    functions: [{function: CHIP_PU, class: system, direction: in}]
routing:
  - kind: any_pin
    label: GPIO matrix
    pads: {range: [GPIO0, GPIO48]}
    notes: Any signal can be routed to any GPIO through GPIO_FUNCn_OUT_SEL / GPIO_FUNCy_IN_SEL
    functions:
      - {function: I2C0_SCL, peripheral: I2C0, signal: SCL, direction: inout, vendor: {in: I2CEXT0_SCL_IN, out: I2CEXT0_SCL_OUT}}
      - {function: I2C0_SDA, peripheral: I2C0, signal: SDA, direction: inout, vendor: {in: I2CEXT0_SDA_IN, out: I2CEXT0_SDA_OUT}}
      - {function: I2C1_SCL, peripheral: I2C1, signal: SCL, direction: inout, vendor: {in: I2CEXT1_SCL_IN, out: I2CEXT1_SCL_OUT}}
      - {function: I2C1_SDA, peripheral: I2C1, signal: SDA, direction: inout, vendor: {in: I2CEXT1_SDA_IN, out: I2CEXT1_SDA_OUT}}
      - {function: I2S0_I_BCK, peripheral: I2S0, signal: I_BCK, direction: inout, vendor: {in: I2S0I_BCK_IN, out: I2S0I_BCK_OUT}}
      - {function: I2S0_I_SD, peripheral: I2S0, signal: I_SD, direction: in, vendor: {in: I2S0I_SD_IN}}
      - {function: I2S0_I_WS, peripheral: I2S0, signal: I_WS, direction: inout, vendor: {in: I2S0I_WS_IN, out: I2S0I_WS_OUT}}
      - {function: I2S0_MCLK, peripheral: I2S0, signal: MCLK, direction: out, vendor: {out: I2S0_MCLK_OUT}}
      - {function: I2S0_O_BCK, peripheral: I2S0, signal: O_BCK, direction: inout, vendor: {in: I2S0O_BCK_IN, out: I2S0O_BCK_OUT}}
      - {function: I2S0_O_SD, peripheral: I2S0, signal: O_SD, direction: out, vendor: {out: I2S0O_SD_OUT}}
      - {function: I2S0_O_WS, peripheral: I2S0, signal: O_WS, direction: inout, vendor: {in: I2S0O_WS_IN, out: I2S0O_WS_OUT}}
      - {function: I2S1_I_BCK, peripheral: I2S1, signal: I_BCK, direction: inout, vendor: {in: I2S1I_BCK_IN, out: I2S1I_BCK_OUT}}
      - {function: I2S1_I_SD, peripheral: I2S1, signal: I_SD, direction: in, vendor: {in: I2S1I_SD_IN}}
      - {function: I2S1_I_WS, peripheral: I2S1, signal: I_WS, direction: inout, vendor: {in: I2S1I_WS_IN, out: I2S1I_WS_OUT}}
      - {function: I2S1_MCLK, peripheral: I2S1, signal: MCLK, direction: out, vendor: {out: I2S1_MCLK_OUT}}
      - {function: I2S1_O_BCK, peripheral: I2S1, signal: O_BCK, direction: inout, vendor: {in: I2S1O_BCK_IN, out: I2S1O_BCK_OUT}}
      - {function: I2S1_O_SD, peripheral: I2S1, signal: O_SD, direction: out, vendor: {out: I2S1O_SD_OUT}}
      - {function: I2S1_O_WS, peripheral: I2S1, signal: O_WS, direction: inout, vendor: {in: I2S1O_WS_IN, out: I2S1O_WS_OUT}}
      - {function: LCD_CAM_CAM_CLK, peripheral: LCD_CAM, signal: CAM_CLK, direction: out, vendor: {out: CAM_CLK}}
      - {function: LCD_CAM_CAM_PCLK, peripheral: LCD_CAM, signal: CAM_PCLK, direction: in, vendor: {in: CAM_PCLK}}
      - {function: LCD_CAM_DATA_IN0, peripheral: LCD_CAM, signal: DATA_IN0, direction: in, vendor: {in: CAM_DATA_IN0}}
      - {function: LCD_CAM_DATA_IN1, peripheral: LCD_CAM, signal: DATA_IN1, direction: in, vendor: {in: CAM_DATA_IN1}}
