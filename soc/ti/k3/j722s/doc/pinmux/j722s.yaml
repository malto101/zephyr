# J722S (AM67A) pad table for board-pinout.
# Pad names are TI mode-0 signal names; aliases are AMW package balls.
# mode is the PADCONFIG MUXMODE value (K3_PINMUX MUX_MODE_n).
schema_version: '1.0'
soc: j722s
description: 'TI J722S / AM67A. Partial: general-purpose pads so far; extend from the datasheet as boards need more.'
reference:
  title: AM67A Processors datasheet (SPRSP77)
  section: Pin Attributes / Signal Descriptions
  url: https://www.ti.com/lit/ds/symlink/am67a.pdf
domains:
  VDDSHV_MAIN:
    io_voltages: [1.8, 3.3]
    notes: MAIN domain general-purpose IO supply
  VDDSHV_MCU:
    io_voltages: [1.8, 3.3]
    notes: MCU/WKUP domain IO supply
pad_defaults:
  type: io
  schmitt: true
pads:
