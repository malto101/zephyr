name: Hexagon on-demand Twister

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test
        required: true
        type: string
      run_ciqemu_default:
        description: Run ciqemu without HEXAGON_MMU
        required: false
        default: true
        type: boolean
      run_ciqemu_mmu:
        description: Run ciqemu with HEXAGON_MMU
        required: false
        default: true
        type: boolean
      run_hexnext_default:
        description: Run hex-next QEMU without HEXAGON_MMU
        required: false
        default: true
        type: boolean
      run_hexnext_mmu:
        description: Run hex-next QEMU with HEXAGON_MMU
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
    steps:
      - name: Build matrix
        id: matrix
        env:
          CIQEMU_DEFAULT: ${{ inputs.run_ciqemu_default }}
          CIQEMU_MMU: ${{ inputs.run_ciqemu_mmu }}
          HEXNEXT_DEFAULT: ${{ inputs.run_hexnext_default }}
          HEXNEXT_MMU: ${{ inputs.run_hexnext_mmu }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          variants = [
              ("CIQEMU_DEFAULT", "ciqemu", False, "ciqemu-default"),
              ("CIQEMU_MMU", "ciqemu", True, "ciqemu-mmu"),
              ("HEXNEXT_DEFAULT", "hexnext", False, "hexnext-default"),
              ("HEXNEXT_MMU", "hexnext", True, "hexnext-mmu"),
          ]
          matrix = [
              {"qemu": qemu, "mmu": mmu, "name": name}
              for key, qemu, mmu, name in variants
              if os.environ[key].lower() == "true"
          ]
          print(f"matrix={json.dumps({'include': matrix}, separators=(',', ':'))}")
          print(f"has_jobs={'true' if matrix else 'false'}")
          PY

  build-test:
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ZEPHYR_BASE: ${{ github.workspace }}
      ZEPHYR_TOOLCHAIN_VARIANT: hexagon
      HEXAGON_TOOLCHAIN_PATH: ${{ runner.temp }}/hexagon-toolchain/host
      TWISTER_OUT: twister-out-${{ matrix.name }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          path: .workflow-scripts
          sparse-checkout: .github/scripts/hexnext-qemu-wrapper
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-tk python3-venv \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev \
            libmagic1 libffi-dev libssl-dev zstd

      - name: Initialize west workspace
        run: |
          python3 -m pip install --user west
          export PATH="$HOME/.local/bin:$PATH"
          west init -l .
          west config manifest.group-filter '+ci,+optional,+testing'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          west update
          west packages pip --install
          python3 -m pip install -r scripts/requirements-actions.txt --require-hashes

      - name: Remove board test tag filter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("boards/qemu/hexagon/qemu_hexagon.yaml")
          board = yaml.safe_load(path.read_text())
          testing = board.get("testing", {})
          if "only_tags" in testing:
              del testing["only_tags"]
              path.write_text(yaml.safe_dump(board, sort_keys=False))
          else:
              print(f"{path} already has no testing.only_tags")
          PY
          if grep -q '^[[:space:]]*only_tags:' boards/qemu/hexagon/qemu_hexagon.yaml; then
            echo "testing.only_tags was not removed" >&2
            exit 1
          fi

      - name: Download and verify Hexagon toolchain
        env:
          TOOLCHAIN_URL: >-
            https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/22.1.8________/clang+llvm-22.1.8-cross-hexagon-unknown-linux-musl_x86_64-linux-gnu.tar.zst
          TOOLCHAIN_SHA256: bc122fe6473ead9693613a6ab3a177c5583653ff76b937e7578cf7de0273315b
        run: |
          archive="$RUNNER_TEMP/hexagon-toolchain.tar.zst"
          curl --fail --location --retry 3 "$TOOLCHAIN_URL" --output "$archive"
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum --check --status
          mkdir -p "$HEXAGON_TOOLCHAIN_PATH"
          tar --zstd -xf "$archive" -C "$HEXAGON_TOOLCHAIN_PATH" \
            --strip-components=2
          test -x "$HEXAGON_TOOLCHAIN_PATH/bin/clang"
          sudo apt-get install --no-install-recommends -y libc++1-18 libc++abi1-18 libunwind-18
          clang="$HEXAGON_TOOLCHAIN_PATH/bin/clang"
          missing=$(ldd "$clang" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "$missing" >&2
            exit 1
          fi
          "$clang" --version
          "$HEXAGON_TOOLCHAIN_PATH/bin/hexagon-clang" --version

      - name: Build hex-next QEMU
        if: matrix.qemu == 'hexnext'
        run: |
          sudo apt-get install --no-install-recommends -y \
            pkg-config flex bison meson libglib2.0-dev libpixman-1-dev libslirp-dev
          git clone --depth 1 --branch hex-next \
            https://github.com/qualcomm/qemu.git "$RUNNER_TEMP/qemu-hex-next"
          cd "$RUNNER_TEMP/qemu-hex-next"
          ./configure --target-list=hexagon-softmmu --disable-werror --extra-cflags=-O2
          ninja -C build

      - name: Configure emulator environment
        run: |
          if [ "${{ matrix.qemu }}" = hexnext ]; then
            wrapper="$GITHUB_WORKSPACE/.workflow-scripts/.github/scripts/hexnext-qemu-wrapper"
            chmod +x "$wrapper/qemu-system-hexagon"
            echo "QEMU_BIN_PATH=$wrapper" >> "$GITHUB_ENV"
            echo "HEXNEXT_QEMU_BIN=$RUNNER_TEMP/qemu-hex-next/build/qemu-system-hexagon" \
              >> "$GITHUB_ENV"
            echo "HEXNEXT_WRAPPER_CACHE=$RUNNER_TEMP/hexnext-wrapper-cache" >> "$GITHUB_ENV"
            echo "HEXAGON_H2_LOADLINUX=$RUNNER_TEMP/qemu-hex-next/pc-bios/hexagon_loadlinux_v68" \
              >> "$GITHUB_ENV"
          else
            echo "QEMU_BIN_PATH=$HEXAGON_TOOLCHAIN_PATH/bin" >> "$GITHUB_ENV"
          fi
          echo "$HEXAGON_TOOLCHAIN_PATH/bin" >> "$GITHUB_PATH"

      - name: Run full Hexagon Twister sweep
        run: |
          set -o pipefail
          args=()
          if [ "${{ matrix.mmu }}" = true ]; then
            args+=(--extra-args CONFIG_HEXAGON_MMU=y)
          fi
          west twister -p qemu_hexagon/qemu_hexagon_virt \
            --test-config tests/test_config_ci.yaml \
            -v -N -M --retry-failed 2 --timeout-multiplier 2 \
            --inline-logs -j "$(nproc)" --clobber-output \
            -O "$TWISTER_OUT" "${args[@]}" 2>&1 | tee "twister-${{ matrix.name }}.log"

      - name: Write Twister summary
        if: always()
        env:
          RESULT_FILE: ${{ env.TWISTER_OUT }}/twister.json
          VARIANT: ${{ matrix.name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT_FILE"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          variant = os.environ["VARIANT"]
          if not result_path.is_file():
              with summary.open("a") as output:
                  output.write(f"## {variant}\n\nTwister did not produce `twister.json`.\n")
              raise SystemExit(0)

          suites = json.loads(result_path.read_text()).get("testsuites", [])
          statuses = [suite.get("status", "unknown") for suite in suites]
          counts = {status: statuses.count(status) for status in sorted(set(statuses))}
          failures = [suite for suite in suites if suite.get("status") in ("failed", "error")]
          with summary.open("a") as output:
              output.write(f"## {variant}\n\n")
              output.write(f"Configurations: **{len(suites)}**\n\n")
              output.write("| Status | Count |\n| --- | ---: |\n")
              for status, count in counts.items():
                  output.write(f"| {status} | {count} |\n")
              if failures:
                  output.write("\n### Failed or errored suites (first 100)\n\n")
                  for suite in failures[:100]:
                      output.write(f"- `{suite.get('name', 'unknown')}` — {suite.get('status')}\n")
          PY

      - name: Write failures-only JSON
        if: always()
        env:
          RESULT_FILE: ${{ env.TWISTER_OUT }}/twister.json
          FAILURE_FILE: ${{ env.TWISTER_OUT }}/twister-failures.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RESULT_FILE"])
          destination = Path(os.environ["FAILURE_FILE"])
          if source.is_file():
              data = json.loads(source.read_text())
              data["testsuites"] = [
                  suite for suite in data.get("testsuites", [])
                  if suite.get("status") in ("failed", "error")
              ]
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(json.dumps(data, indent=1) + "\n")
          PY

      - name: Upload Twister results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hexagon-${{ matrix.name }}-results
          if-no-files-found: ignore
          retention-days: 30
          path: |
            ${{ env.TWISTER_OUT }}/twister.json
            ${{ env.TWISTER_OUT }}/twister-failures.json
            twister-${{ matrix.name }}.log
