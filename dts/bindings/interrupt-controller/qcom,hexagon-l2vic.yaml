description: Qualcomm Hexagon L2 virtual interrupt controller

compatible: "qcom,hexagon-l2vic"

include: [base.yaml, interrupt-controller.yaml]

properties:
  reg:
    required: true

  interrupt-controller:
    required: true

  "#interrupt-cells":
    const: 1

interrupt-cells:
  - irq
