description: |
  Qualcomm shared memory (SMEM). The table of contents sits in the last
  4K of reg. hwlocks is the lock serializing allocations.

compatible: "qcom,smem"

include: base.yaml

properties:
  reg:
    required: true

  hwlocks:
    required: true
