schema_version: '1.1'
board: beagley_ai
soc: j722s
mux_source: soc
types_inline:
  poe_header:
    kind: receptacle
    receptacle_type: other
    description: 2x2 PoE HAT header
  mipi_ffc_22:
    kind: receptacle
    receptacle_type: other
    description: 22-pin 0.5 mm MIPI CSI/DSI FFC connector
  debug_uart_3pin:
    kind: receptacle
    receptacle_type: uart-dbg
    description: 3-pin JST-SH debug UART
  battery_2pin:
    kind: receptacle
    receptacle_type: other
    description: 2-pin RTC backup battery connector
  pcie_ffc:
    kind: receptacle
    receptacle_type: other
    description: 16-pin PCIe x1 FFC connector
  ufl_antenna:
    kind: receptacle
    receptacle_type: other
    description: U.FL RF antenna connector
  fan_4pin:
    kind: receptacle
    receptacle_type: other
    description: 4-pin JST-SH fan connector
software:
  zephyr:
    name: Zephyr
    kind: rtos
    runs_on: [main_r5f0_0, mcu_r5f0_0]
