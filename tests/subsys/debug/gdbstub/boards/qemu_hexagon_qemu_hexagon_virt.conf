# Hexagon has no zephyr,gdbstub-uart chosen node, so the generic serial
# backend cannot resolve a UART device; use the custom backend, which
# reuses the console UART instead.
CONFIG_GDBSTUB_SERIAL_BACKEND=n
CONFIG_GDBSTUB_CUSTOM_BACKEND=y

# 44 registers * 4 bytes * 2 (hex-encoded) = 352 bytes minimum.
CONFIG_GDBSTUB_BUF_SZ=512
