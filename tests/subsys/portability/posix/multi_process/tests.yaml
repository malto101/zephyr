common:
  # Times out on the Hexagon port: k_busy_wait() polls the hypervisor
  # clock, and under QEMU that costs about 0.19 s of host time per
  # simulated millisecond (a measured 10 ms wait takes 1.92 s), so any
  # suite that busy-waits blows through its budget.
  platform_exclude:
    - qemu_hexagon
  filter: not CONFIG_NATIVE_LIBC
  tags:
    - posix
    - multi_process
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
  integration_platforms:
    - qemu_riscv64
  min_flash: 64
  min_ram: 32
tests:
  portability.posix.muti_process: {}
  portability.posix.muti_process.minimal:
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
  portability.posix.muti_process.newlib:
    toolchain_exclude:
      - zephyr/gnu
      - zephyr/llvm
    filter: TOOLCHAIN_HAS_NEWLIB == 1
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
  portability.posix.muti_process.picolibc:
    tags: picolibc
    filter: CONFIG_PICOLIBC_SUPPORTED
    extra_configs:
      - CONFIG_PICOLIBC=y
