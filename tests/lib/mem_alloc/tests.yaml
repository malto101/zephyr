common:
  arch_exclude: posix
  tags:
    - clib
    - userspace
  integration_platforms:
    - qemu_x86
tests:
  libraries.libc.minimal.mem_alloc:
    extra_args: CONF_FILE=prj.conf
    tags:
      - minimal_libc
  libraries.libc.minimal.mem_alloc_negative_testing:
    extra_args: CONF_FILE=prj_negative_testing.conf
    tags:
      - minimal_libc
  libraries.libc.newlib.mem_alloc:
    toolchain_exclude:
      - zephyr/gnu
      - zephyr/llvm
    extra_args: CONF_FILE=prj_newlib.conf
    filter: TOOLCHAIN_HAS_NEWLIB == 1
    min_ram: 16
    tags:
      - newlib
  libraries.libc.newlib_nano.mem_alloc:
    toolchain_exclude:
      - zephyr/gnu
      - zephyr/llvm
    extra_args: CONF_FILE=prj_newlibnano.conf
    filter: CONFIG_HAS_NEWLIB_LIBC_NANO
    tags:
      - newlib
  libraries.libc.picolibc.mem_alloc:
    platform_exclude:
      # Times out on the Hexagon port: k_busy_wait() polls the hypervisor
      # clock, and under QEMU that costs about 0.19 s of host time per
      # simulated millisecond (a measured 10 ms wait takes 1.92 s), so any
      # suite that busy-waits blows through its budget.
      - qemu_hexagon
    extra_args: CONF_FILE=prj_picolibc.conf
    filter: CONFIG_PICOLIBC_SUPPORTED
    tags:
      - picolibc
