tests:
  kernel.timer.monotonic:
    platform_exclude:
      # Times out on the Hexagon port: k_busy_wait() polls the hypervisor
      # clock, and under QEMU that costs about 0.19 s of host time per
      # simulated millisecond (a measured 10 ms wait takes 1.92 s), so any
      # suite that busy-waits blows through its budget.
      - qemu_hexagon
    tags:
      - kernel
      - timer
  kernel.timer.monotonic.apic.tsc:
    tags:
      - kernel
      - timer
      - apic_tsc
    platform_allow: intel_ehl_crb
    extra_configs:
      - CONFIG_APIC_TSC_DEADLINE_TIMER=y
      - CONFIG_HPET_TIMER=n
  kernel.timer.monotonic.icount_off:
    # Extra test for GH-48608
    tags:
      - kernel
      - timer
    platform_allow: mps2/an385
    extra_configs:
      - CONFIG_QEMU_ICOUNT=n
