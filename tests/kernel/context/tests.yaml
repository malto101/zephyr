common:
  # The k_cpu_idle test cannot tolerate background wake-ups from the
  # NRU eviction algorithm's periodic pulse.
  filter: not CONFIG_EVICTION_NRU
  # Times out on the Hexagon port: k_busy_wait() polls the hypervisor
  # clock, and under QEMU that costs about 0.19 s of host time per
  # simulated millisecond (a measured 10 ms wait takes 1.92 s), so any
  # suite that busy-waits blows through its budget.
  platform_exclude:
    - qemu_hexagon

tests:
  kernel.context:
    tags: kernel
    extra_configs:
      - CONFIG_TEST_EXTRA_STACK_SIZE=1024
    min_ram: 16
  kernel.context.minimallibc:
    filter: CONFIG_MINIMAL_LIBC_SUPPORTED
    tags:
      - kernel
      - libc
    extra_configs:
      - CONFIG_TEST_EXTRA_STACK_SIZE=1024
      - CONFIG_MINIMAL_LIBC=y
    min_ram: 16
  linker.linker_generator:
    platform_allow: qemu_cortex_m3
    tags:
      - kernel
      - linker_generator
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
      - CONFIG_TEST_EXTRA_STACK_SIZE=1024
