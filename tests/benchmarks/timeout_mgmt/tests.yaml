common:
  # Times out on the Hexagon port: k_busy_wait() polls the hypervisor
  # clock, and under QEMU that costs about 0.19 s of host time per
  # simulated millisecond (a measured 10 ms wait takes 1.92 s), so any
  # suite that busy-waits blows through its budget.
  platform_exclude:
    - qemu_hexagon
  platform_key:
    - arch
  min_ram: 32
  timeout: 120
  tags:
    - kernel
    - benchmark
  integration_platforms:
    - qemu_x86
    - qemu_cortex_a53
  harness: console

tests:
  benchmark.timeout_mgmt.simple:
    harness_config:
      type: one_line
      regex:
        - "PROJECT EXECUTION SUCCESSFUL"
