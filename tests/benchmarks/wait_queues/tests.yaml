common:
  # Times out on the Hexagon port: the scheduler benchmarks depend on time
  # slicing, which does not work yet (kernel.scheduler.*_no_timeslicing pass
  # while every timeslicing variant times out).
  platform_exclude:
    - qemu_hexagon
  platform_key:
    - arch
  tags:
    - kernel
    - benchmark
  integration_platforms:
    - qemu_x86
    - qemu_cortex_a53
  timeout: 120
  harness: console
  harness_config:
    type: one_line
    regex:
      - "PROJECT EXECUTION SUCCESSFUL"
    record:
      regex:
        - "REC: (?P<metric>.*) - (?P<description>.*):(?P<cycles>.*) cycles ,(?P<nanoseconds>.*) ns"
  extra_configs:
    - CONFIG_BENCHMARK_RECORDING=y

tests:
  benchmark.wait_queues.simple:
    extra_configs:
      - CONFIG_WAITQ_SIMPLE=y

  benchmark.wait_queues.scalable:
    extra_configs:
      - CONFIG_WAITQ_SCALABLE=y
